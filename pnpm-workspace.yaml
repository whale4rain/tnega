packages:
  - packages/*
  - packages/search/*
  - packages/browser/*
  - packages/sandbox/*
  - packages/spill/*
  - packages/memory/*
  - packages/subagent/*
  - packages/jobs/*
  - packages/project/*
  - packages/loop/*
  - apps/*

onlyBuiltDependencies:
  - esbuild
  - koffi
allowBuilds:
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  electron-winstaller: false
  esbuild: true
  koffi: true
minimumReleaseAgeExclude:
  - tnega@0.1.1
  - '@earendil-works/pi-codemode@0.99.1'
