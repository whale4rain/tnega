appId: dev.tnega.desktop
productName: Tnega
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../../dist
    to: tnega-runtime/dist
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
