appId: dev.tnega.desktop
productName: Tnega
directories:
  output: release
# The update feed: electron-builder writes latest.yml (+ blockmaps) beside the
# installers, and electron-updater in the installed app reads it from the
# latest GitHub release. See docs/releases/publishing.md.
publish:
  provider: github
  owner: whale4rain
  repo: tnega
  releaseType: release
files:
  - out/**
  - build/icon.png
  - package.json
extraResources:
  - from: ../../dist
    to: tnega-runtime/dist
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
nsis:
  # No spaces: the file on disk, on the release and in latest.yml share one name.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
