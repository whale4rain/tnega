<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tnega</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23b6b6b6'/%3E%3Cg transform='translate(32 32) scale(.84) translate(-32 -31)'%3E%3Cpath fill='%230e0e0e' d='M6.5 32.5C7.5 17.5 18.5 8.5 32 8.5S56.5 17.5 57.5 31.5C53.5 28.2 48.2 28.4 44.8 32.2C41.2 28.4 35.6 28.4 32 32.4C28.4 28.4 22.8 28.4 19.2 32.2C15.8 28.6 10.4 28.6 6.5 32.5Z'/%3E%3Cpath d='M32 9V4.6M32 31.5L31.6 50.5C32 56.5 24.6 57 23.6 51.5' fill='none' stroke='%230e0e0e' stroke-width='4' stroke-linecap='round'/%3E%3Cg fill='%23b6b6b6'%3E%3Crect x='23.5' y='14' width='6' height='12' rx='3'/%3E%3Crect x='34.5' y='14' width='6' height='12' rx='3'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint so the page never flashes.
      try {
        var pref = localStorage.getItem('tnega.theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // Display preferences from Settings → Appearance (lib/display.ts).
        document.documentElement.dataset.palette = 'umbrella'
        document.documentElement.dataset.glass = 'off'
        var display = { palette: 'tnega.palette', density: 'tnega.density', textSize: 'tnega.textSize', reading: 'tnega.readingWidth', glass: 'tnega.glass' }
        for (var attribute in display) {
          var value = localStorage.getItem(display[attribute])
          if (value && /^[a-z]+$/.test(value)) document.documentElement.dataset[attribute] = value
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
