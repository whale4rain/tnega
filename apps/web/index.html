<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tnega</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='15' fill='%23f3f3f1' stroke='%23dcdcd8' stroke-width='1.5'/%3E%3Cdefs%3E%3Cmask id='c'%3E%3Cpath fill='white' d='M16.5 50 A9.5 9.5 0 0 1 12.99 31.67 A14 14 0 0 1 38.32 20.49 A10.5 10.5 0 0 1 51.88 32.07 A9.5 9.5 0 0 1 47.5 50 Z'/%3E%3Cg fill='black'%3E%3Crect x='0' y='33.2' width='64' height='4'/%3E%3C/g%3E%3C/mask%3E%3C/defs%3E%3Cg transform='translate(32 32) scale(.86) translate(-32 -32)'%3E%3Crect width='64' height='64' fill='%23111111' mask='url(%23c)'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint so the page never flashes.
      try {
        var pref = localStorage.getItem('tnega.theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // Display preferences from Settings → Appearance (lib/display.ts).
        document.documentElement.dataset.palette = 'umbrella'
        document.documentElement.dataset.glass = 'off'
        var display = { palette: 'tnega.palette', density: 'tnega.density', textSize: 'tnega.textSize', reading: 'tnega.readingWidth', glass: 'tnega.glass' }
        for (var attribute in display) {
          var value = localStorage.getItem(display[attribute])
          if (value && /^[a-z]+$/.test(value)) document.documentElement.dataset[attribute] = value
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
