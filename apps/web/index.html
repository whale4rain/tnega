<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tnega</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%232f6fd0'%3E%3Ccircle cx='32' cy='23' r='16'/%3E%3Ccircle cx='18' cy='34' r='14'/%3E%3Ccircle cx='46' cy='34' r='14'/%3E%3Ccircle cx='24' cy='46' r='13'/%3E%3Ccircle cx='40' cy='46' r='13'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Crect x='20.8' y='23.5' width='8.4' height='17' rx='4.2'/%3E%3Crect x='34.8' y='23.5' width='8.4' height='17' rx='4.2'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint so the page never flashes.
      try {
        var pref = localStorage.getItem('tnega.theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // Display preferences from Settings → Appearance (lib/display.ts).
        var display = { palette: 'tnega.palette', density: 'tnega.density', textSize: 'tnega.textSize', reading: 'tnega.readingWidth' }
        for (var attribute in display) {
          var value = localStorage.getItem(display[attribute])
          if (value && /^[a-z]+$/.test(value)) document.documentElement.dataset[attribute] = value
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
